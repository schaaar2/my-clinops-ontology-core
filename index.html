<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ontology Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ontology Browser</h1>
  </header>

  <main>
    <section>
      <h2>Ontologies</h2>
      <select id="ontologySelect"></select>
      <button id="loadOntology">Load</button>
    </section>

    <section>
      <h2>Search</h2>
      <input id="searchBox" type="text" placeholder="Search by label, IRI, definition, or synonym">
      <div class="filters">
        <label><input type="checkbox" id="filter-classes" checked> Classes</label>
        <label><input type="checkbox" id="filter-object-properties" checked> Object properties</label>
        <label><input type="checkbox" id="filter-data-properties" checked> Data properties</label>
        <label><input type="checkbox" id="filter-annotation-properties" checked> Annotation properties</label>
        <label><input type="checkbox" id="filter-individuals" checked> Individuals</label>
      </div>
    </section>

    <section>
      <h2>Entities</h2>
      <ul id="classList"></ul>
    </section>

    <section>
      <h2>Details</h2>
      <div id="details">
        <p class="muted">Select an entity to see all of its properties.</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/n3/browser/n3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
