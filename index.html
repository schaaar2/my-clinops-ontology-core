<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClinOps Ontology Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ClinOps Ontology Browser</h1>
    <p class="subtitle">Browse classes, properties, individuals, and every triple in the ontology.</p>
  </header>

  <main>
    <aside class="sidebar">
      <section class="panel">
        <h2>Ontology</h2>
        <select id="ontologySelect"></select>
        <button id="loadOntology">Load</button>
        <p id="status" class="status"></p>
      </section>

      <section class="panel">
        <h2>Search</h2>
        <input id="searchBox" type="text" placeholder="Search label, IRI, definition, synonym">
      </section>

      <section class="panel filters">
        <h2>Show</h2>
        <label><input type="checkbox" data-kind="Class" checked> Classes</label>
        <label><input type="checkbox" data-kind="Object property" checked> Object properties</label>
        <label><input type="checkbox" data-kind="Data property" checked> Data properties</label>
        <label><input type="checkbox" data-kind="Annotation property" checked> Annotation properties</label>
        <label><input type="checkbox" data-kind="Individual" checked> Individuals</label>
      </section>

      <section class="panel">
        <h2>Entities</h2>
        <ul id="entityList" class="entity-list"></ul>
      </section>
    </aside>

    <section class="details-pane">
      <h2>Details</h2>
      <div id="details">
        <p class="muted">Select an entity on the left to see all of its properties.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Static ontology browser. Data is parsed in the browser using N3.js.</p>
  </footer>

  <script src="https://unpkg.com/n3/browser/n3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
