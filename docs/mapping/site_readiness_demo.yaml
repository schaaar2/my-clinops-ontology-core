# Ontology concept -> CSV source mapping
# ClinicalTrialSite:
#   table: sites.csv
#   idColumn: site_id        # primary key used to join

# hasEnrollmentCount:
#   table: sites.csv
#   column: enrollment_count # how many patients enrolled at the site
schema_version: "0.1"

mappings:
  - source:
      ontology_class: 
        rdfs:label: "Clinical Study"  
        uri: http://purl.obolibrary.org/obo/NCIT_C15206
      data_property: 
        rdfs:label: "Uniqure Identifier"
        uri: http://www.semanticweb.org/schaaar2/ontologies/2026/7/ClinOps-Core/NV_D0091
    target:
      database: 
        table: site_readiness_demo.csv                 # database table name
        field: "Study"
      key_fields:
        field: "Study"
        field: "SiteID"

  - source:
      ontology_class: 
        rdfs:label: "Study Site Number"
        uri: http://purl.obolibrary.org/obo/NCIT_C83100
      data_property:
        rdfs:label: "Identifier"
        uri: http://www.semanticweb.org/schaaar2/ontologies/2026/7/ClinOps-Core/NV_D0090
    target:
      database:
        table: site_readiness_demo.csv       
        field: "SiteID"
      key_fields:
        field: "Study"
        field: "SiteID"    

  - source:
      ontology_class: 
        rdfs:label: "Study Site"
        uri: https://w3id.org/cdisc/usdm/v4/StudySite # "Study Site"   # ontology class name
      data_property: 
        rdfs:label: StudySite-name
        uri: https://w3id.org/cdisc/usdm/v4/StudySite-name # "Study Site Name"        # property on that class
    target:
      database:
        table: site_readiness_demo.csv       
        field: "SiteID"
      key_fields:
        field: "Study"
        field: "SiteID" 
    
  - source:
      ontology_class: 
        rdfs:lable: "Study Site"
        uri: https://w3id.org/cdisc/usdm/v4/StudySite # "Study Site"   # ontology class name
      data_property: 
      rdfs:lable: 
      uri: https://w3id.org/cdisc/usdm/v4/StudySite-name # "Study Site Name"        # property on that class
    target:
      database:
        table: site_readiness_demo.csv       
        field: "SiteID"
      key_fields:
        field: "Study"
        field: "SiteID" 

      
